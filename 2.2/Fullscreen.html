<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Selection</title>
</head>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.fullscreen-selection {
width: 100vw;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: linear-gradient(to right, #5f9cff, #7bddfe, #7bddfe, #5f9cff);
color: white;
font-size: 2rem;
text-align: center;
}
</style>
<body>
<selection class="fullscreen-selection">
Selamat Datang Di Halaman Fullscreen Selection!
</selection>
</body>
</html>
