<!DOCTYPE html>
<html lang="en">
<head>
<style>
    .box {
        width: 100%;
        padding: 20px;
        background-color: steelblue;
        color: white;
        text-align: center;
    }

    @media (max-width: 768px) {
        .box {
            background-color: darkorange;
        }
    }

    @media (max-width: 480px) {
        .box {
            background-color: crimson;
            font-size: 14px;
        }
    }
</style>

<body>
    <div class="box">Contoh Box Responsive</div>
</body>
</head>
</html>
