<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contoh unit em dan rem</title>
    <link rel="stylesheet" href="em-rem.css">
</head>
<body>
    <div class="judul">
    <h1>penggunaan em dan rem</h1>
    <p>paragraf ini menggunakan ukuran font default (1rem = 16px)</p>
    </div>
    <div class="container">
        <p>paragraf ini dalam container dengan ukuran font 1.5rem (24px)</p>
        <div class="box">
            <p>ini adalah box dengan font-size 1.2em (1.2 * 24px = 28.8px)</p>
            <p class="nested">teks ini dalam .nested dengan font-size 1.2em (1.2 * 28.8px = 34.56px)</p>
        </div>
    </div>
</body>
</html>
