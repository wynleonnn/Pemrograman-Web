<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        div p {
            background-color: cornflowerblue;
        }

        selection p {
            background-color: lightcoral;
        }
    </style>
    <div>
        <p>This is a paragraph inside a div.</p>
        <div>
            <p>This is another paragraph inside a different div.</p>
            <selection>
                <p>This is a paragraph inside the selection.</p>
            </selection>
        </div>
    </div>
    <selection>
        <p>This is a paragraph inside the selection.</p>
    </selection>


</body>

</html>
